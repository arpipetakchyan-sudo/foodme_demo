# CI for FoodMe: builds and tests the backend, storefront and admin panel
# on every push and pull request. Each app runs as its own job, in parallel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Tests use an in-memory H2 database, so no Postgres service is needed.
      - name: Build and test
        run: bash ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: apps/backend/build/reports/tests/
          retention-days: 7

  web:
    name: Web storefront
    runs-on: mac os-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # End-to-end tests: real backend + Postgres, then Playwright drives the storefront and admin panel.
  e2e:
    name: E2E tests (Playwright)
    runs-on: mac-latest
    needs: [ web, admin]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VITE_API_BASE_URL: http://localhost:8081

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json

      - name: Install dependencies and browser
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/admin
          # web and admin pin different Playwright versions, so install the browser for each
          (cd apps/web && npx playwright install --with-deps chromium)
          (cd apps/admin && npx playwright install chromium)

      # In production the backend serves the admin panel at /backoffice (see apps/backend/Dockerfile),
      # and happy-path.spec.ts checks that page, so bundle it into the backend here too.
      - name: Build admin panel into backend
        run: |
          npm run build --prefix apps/admin
          mkdir -p apps/backend/src/main/resources/static/backoffice
          cp -R apps/admin/dist/. apps/backend/src/main/resources/static/backoffice/

      # Flyway creates the tables and seed data in Postgres on startup.
      - name: Start backend
        working-directory: apps/backend
        run: |
          bash ./gradlew bootJar --no-daemon -q
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          nohup java -jar "$JAR" \
            --foodme.latency.min-ms=0 --foodme.latency.max-ms=0 \
            > backend.log 2>&1 &
          echo "Waiting for backend..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health && exit 0
            sleep 3
          done
          echo "Backend did not start"; cat backend.log; exit 1

      # Playwright starts each app's dev server itself (see playwright.config.ts).
      - name: Storefront E2E
        working-directory: apps/web
        run: npx playwright test

      - name: Admin E2E
        if: success() || failure()
        working-directory: apps/admin
        run: npx playwright test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report/
            apps/admin/playwright-report/
            apps/backend/backend.log
          retention-days: 7
